# Build the acidic package and publish it to PyPI and GitHub Releases.
# This workflow is adapted from:
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#
# Releases of the acidic package are triggered by tags of the form acidic-vX.Y.Z.
# The plain vX.Y.Z tags are reserved for releases of the ACID dataset.
# Pushes to the main branch are only published to TestPyPI.

name: release
on:
  push:
    branches:
      - main
    tags:
      - 'acidic-v*'
    paths:
      # ... and only if relevant files have changed (not applied to tags).
      - acidic/**
      - .github/scripts/extract_acidic_notes.sh
      - .github/workflows/release.yaml

env:
  # This is not critical.
  # It is used only for showing URLs in GitHub Actions web interface.
  PYPI_NAME: acidic
  TITLE: ACID Internal Components (acidic)

jobs:
  build:
    name: Build distribution
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/acidic-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#acidic-v}"
          PKG_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' acidic/pyproject.toml)
          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "Tag version (${TAG_VERSION}) differs from acidic/pyproject.toml (${PKG_VERSION})."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Use a unique post-release version for TestPyPI (main branch only)
        # The version in acidic/pyproject.toml is static, so each build on the main branch
        # gets a post-release suffix with the run number, e.g. 0.1.0 => 0.1.0.post123.
        # This change is only made in CI and is not committed.
        if: github.ref == 'refs/heads/main'
        run: uv version --project acidic --frozen --bump "post=${GITHUB_RUN_NUMBER}"
      - name: Build package
        run: uv build --out-dir dist acidic
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Extract the release notes
        # Context values are passed through environment variables (GITHUB_*, set by the runner)
        # instead of ${{ ... }} expressions, which would be pasted unquoted into the script.
        run: .github/scripts/extract_acidic_notes.sh "${GITHUB_REPOSITORY}" "${GITHUB_REF}"
      - name: Store the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/acidic-v')  # only publish to PyPI on tag pushes
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PYPI_NAME }}
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python distribution with Sigstore
      and upload them to GitHub Release
    timeout-minutes: 5
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      # GITHUB_REF_NAME, GITHUB_REPOSITORY and TITLE are used as environment variables
      # instead of ${{ ... }} expressions, which would be pasted unquoted into the script.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "${TITLE} ${GITHUB_REF_NAME}"
          --notes-file notes.md
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload
          "${GITHUB_REF_NAME}"
          dist/**
          --repo "${GITHUB_REPOSITORY}"

  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    timeout-minutes: 5
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'molmod' }}
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ env.PYPI_NAME }}
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Each run has a unique post-release version, but re-running a workflow
          # keeps the run number, so the version may already exist on TestPyPI.
          skip-existing: true
